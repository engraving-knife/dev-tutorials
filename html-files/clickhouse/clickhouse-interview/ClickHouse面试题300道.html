<body>

<div class="progress-bar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="container">
  <header>
    <div class="header-badge">✨ 面试必备</div>
    <h1>ClickHouse 面试题 300 道</h1>
    <p class="subtitle">涵盖核心概念、更新数据、删除数据、数据建模、高级指南、性能优化、源码理解、实战场景等十四个模块</p>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-number">300</div>
        <div class="stat-label">精选面试题</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">14</div>
        <div class="stat-label">知识模块</div>
      </div>
      <div class="stat-item">
        <div class="stat-number">3</div>
        <div class="stat-label">难度层级</div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索题目关键词...">
    </div>
    <div class="action-buttons">
      <button class="btn" onclick="expandAll()">展开全部</button>
      <button class="btn" onclick="collapseAll()">收起全部</button>
      <button class="btn btn-primary" onclick="randomQuestion()">随机一题 🎲</button>
    </div>
  </div>

  <div class="category-tabs" id="categoryTabs">
    <!-- 动态生成分类标签 -->
  </div>

  <div id="questionsContainer">
    <!-- 动态生成题目卡片 -->
  </div>

  <footer>
    <div class="divider"></div>
    <p>💡 点击题目即可展开/收起答案 | 支持关键词搜索 | 祝面试顺利！</p>
  </footer>
</div>

<div class="back-to-top" id="backToTop" onclick="scrollToTop()">↑</div>

<script src="assets/questions.js"></script>
<script>
  // 初始化
  document.addEventListener('DOMContentLoaded', function() {
    renderCategories();
    renderQuestions();
    initProgressBar();
    initBackToTop();
    initSearch();
  });

  // 渲染分类标签
  function renderCategories() {
    const tabs = document.getElementById('categoryTabs');
    let html = '<div class="tab active" data-category="all">全部 <span class="tab-count">' + interviewData.total + '</span></div>';
    interviewData.categories.forEach(function(cat) {
      html += '<div class="tab" data-category="' + cat.id + '">' + cat.name + ' <span class="tab-count">' + cat.count + '</span></div>';
    });
    tabs.innerHTML = html;

    tabs.querySelectorAll('.tab').forEach(function(tab) {
      tab.addEventListener('click', function() {
        tabs.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        filterByCategory(tab.dataset.category);
      });
    });
  }

  // 渲染题目
  function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    let html = '';
    let questionNum = 0;

    interviewData.categories.forEach(function(cat) {
      html += '<div class="category-section" data-category="' + cat.id + '">';
      html += '<div class="section-title">';
      html += '<span class="section-icon">' + cat.icon + '</span>';
      html += '<h2>' + cat.name + ' <span class="section-count">(' + cat.count + '题)</span></h2>';
      html += '</div>';

      cat.questions.forEach(function(q) {
        questionNum++;
        html += '<div class="question-card" data-question="' + questionNum + '">';
        html += '<div class="question-header" onclick="toggleAnswer(this)">';
        html += '<div class="question-number">' + questionNum + '</div>';
        html += '<div class="question-text">' + q.q + '</div>';
        html += '<div class="question-toggle">+</div>';
        html += '</div>';
        html += '<div class="answer-container">';
        html += '<div class="answer-content">';
        html += '<span class="answer-label">参考答案</span>';
        html += '<div class="answer-text">' + q.a + '</div>';
        html += '</div>';
        html += '</div>';
        html += '</div>';
      });

      html += '</div>';
    });

    container.innerHTML = html;
  }

  // 切换答案显示
  function toggleAnswer(header) {
    const card = header.parentElement;
    card.classList.toggle('expanded');
  }

  // 展开全部
  function expandAll() {
    document.querySelectorAll('.question-card:not(.hidden)').forEach(function(card) {
      card.classList.add('expanded');
    });
  }

  // 收起全部
  function collapseAll() {
    document.querySelectorAll('.question-card').forEach(function(card) {
      card.classList.remove('expanded');
    });
  }

  // 随机一题
  function randomQuestion() {
    const visibleCards = document.querySelectorAll('.question-card:not(.hidden)');
    if (visibleCards.length === 0) return;
    collapseAll();
    const randomIndex = Math.floor(Math.random() * visibleCards.length);
    const card = visibleCards[randomIndex];
    card.classList.add('expanded');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // 按分类筛选
  function filterByCategory(category) {
    const sections = document.querySelectorAll('.category-section');
    sections.forEach(function(section) {
      if (category === 'all') {
        section.classList.remove('hidden');
        section.querySelectorAll('.question-card').forEach(function(card) {
          card.classList.remove('hidden');
        });
      } else {
        if (section.dataset.category === category) {
          section.classList.remove('hidden');
          section.querySelectorAll('.question-card').forEach(function(card) {
            card.classList.remove('hidden');
          });
        } else {
          section.classList.add('hidden');
        }
      }
    });
    document.getElementById('searchInput').value = '';
  }

  // 搜索功能
  function initSearch() {
    const input = document.getElementById('searchInput');
    let timer;
    input.addEventListener('input', function() {
      clearTimeout(timer);
      timer = setTimeout(function() {
        const keyword = input.value.trim().toLowerCase();
        filterByCategory('all');
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
        document.querySelector('.tab[data-category="all"]').classList.add('active');

        if (!keyword) {
          document.querySelectorAll('.question-card').forEach(function(card) {
            card.classList.remove('hidden');
          });
          document.querySelectorAll('.category-section').forEach(function(section) {
            section.classList.remove('hidden');
          });
          return;
        }

        document.querySelectorAll('.question-card').forEach(function(card) {
          const questionText = card.querySelector('.question-text').textContent.toLowerCase();
          const answerText = card.querySelector('.answer-text').textContent.toLowerCase();
          if (questionText.includes(keyword) || answerText.includes(keyword)) {
            card.classList.remove('hidden');
          } else {
            card.classList.add('hidden');
          }
        });

        // 隐藏没有可见题目的分类
        document.querySelectorAll('.category-section').forEach(function(section) {
          const visibleCards = section.querySelectorAll('.question-card:not(.hidden)');
          if (visibleCards.length === 0) {
            section.classList.add('hidden');
          } else {
            section.classList.remove('hidden');
          }
        });
      }, 200);
    });
  }

  // 进度条
  function initProgressBar() {
    window.addEventListener('scroll', function() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = (scrollTop / docHeight) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
    });
  }

  // 回到顶部
  function initBackToTop() {
    const btn = document.getElementById('backToTop');
    window.addEventListener('scroll', function() {
      if (window.scrollY > 500) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    });
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
